# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review setup for react-native-video.
# CodeRabbit also reads AGENTS.md (and CLAUDE.md, REVIEW.md) as review guidelines by default,
# so the repository rules live there; this file holds only what is specific to review.

language: en-US
tone_instructions: >-
  Be brief and concrete. Name the file and line, what breaks and on which platform
  (iOS, Android, web). No praise. Do not restate what the diff already says.

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: false
    # master (v7) is the default branch; also review the v6 maintenance line.
    base_branches:
      - "support/6\\.x\\.x"
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!**/bun.lock"
    - "!**/Podfile.lock"
    - "!e2e/rn-matrix/**"
    - "!e2e/fixtures/media/**"
    - "!test-app/dist/**"
    - "!**/lib/**"

  path_instructions:
    - path: "packages/react-native-video/src/spec/**"
      instructions: >-
        Nitro specs are the contract between JS and native code. A change here is a public API
        change. Check that the same pull request: regenerates packages/react-native-video/nitrogen/generated/
        (bun react-native-video specs), implements the change in Swift (ios/hybrids/) and in Kotlin
        (android/src/main/java/com/twg/video/), and updates docs/ and skills/react-native-video/.
        Flag a breaking change that the title does not mark.
    - path: "packages/react-native-video/nitrogen/generated/**"
      instructions: >-
        Generated by nitrogen. Do not comment on style or structure. Flag it only when it does not
        match the change in src/spec/nitro/, or when it was edited by hand without a spec change.
    - path: "packages/react-native-video/src/**"
      instructions: >-
        Check parity: a change to props, events, methods or exported types must work the same on iOS,
        Android and web (*.web.ts and src/core/web/), or the pull request must say which platform does
        not get it. Public API changes need docs/ and skills/react-native-video/ updates and unit tests in
        packages/react-native-video/__tests__/. Errors go through onError and rejected promises as
        documented; synchronous methods must not throw where the docs promise a callback.
    - path: "packages/react-native-video/ios/**"
      instructions: >-
        AVPlayer code. Check: UI and AVPlayerLayer work on the main thread; KVO observers, notification
        observers and time observers are removed on release and on source replace; closures that capture
        self use [weak self]; the audio session is not changed when the user opted out
        (disableAudioSessionManagement); picture-in-picture and now-playing state are torn down when the
        view goes away. A change to view behavior must cover both view/fabric/ and view/paper/.
    - path: "packages/react-native-video/android/**"
      instructions: >-
        Media3/ExoPlayer code. Check: the player is used only from its application looper; release()
        runs on every exit path; listeners are removed; no Activity or View is kept after it is
        destroyed; code that uses Media3 HLS or DASH classes must also compile against android/src/stubs/
        (Gradle uses the stubs when a user turns that module off). A change to view behavior must also cover
        android/src/paper/ (old architecture).
    - path: "packages/drm-plugin/**"
      instructions: >-
        DRM is high risk. Check Widevine and FairPlay paths both. Never log license URLs, tokens,
        certificates or request headers. Errors must reach the JS onError with a clear code. Tests in this
        package use Jest, not bun:test.
    - path: "packages/react-native-video/src/expo-plugins/**"
      instructions: >-
        Config plugins change the native projects of every Expo user. Each plugin must be idempotent:
        running prebuild twice must not add duplicate manifest entries, services, permissions or Podfile
        lines. It must work when the target element (for example <service>) does not exist yet.
    - path: "e2e/flows/**"
      instructions: >-
        Apply e2e/README.md. Each flow starts with runFlow ../shared/launch-app.yaml and opens scenarios
        only through ../shared/open-scenario.yaml (never a bare openLink). Use ../shared/press.yaml for
        controls on an idle player and ../shared/wait-for-end.yaml after the natural end. No external
        network. No retry or longer timeout on an assertion to hide a race. A flow that expects playback
        ends with assertNotVisible evt-onError. Assert on markers, not on parsed numbers. One scenario per
        file, and each flow is independent.
    - path: "test-app/src/e2e/**"
      instructions: >-
        A new scenario needs its name in SCENARIO_NAMES (deepLink.ts) and a source in fixtures.ts. New
        markers are derived booleans in eventLog.ts, not raw numbers. Keep markers deterministic on both
        platforms.
    - path: ".github/workflows/**"
      instructions: >-
        Job names in e2e.yml and unit.yml are required-check names; flag any rename. Do not add a path
        filter to pull_request in unit.yml or e2e.yml (a skipped workflow leaves a required check pending).
        A pull_request_target workflow must not check out or run code from the pull request. Secrets must
        not reach jobs that run code from forks.
    - path: "**/package.json"
      instructions: >-
        Any package.json change needs the E2E lockfiles regenerated in the same pull request
        (node scripts/e2e/use-rn-version.mjs 0.82 --refresh and 0.87 --refresh, then commit
        e2e/rn-matrix/). Flag it when e2e/rn-matrix/ did not change.
    - path: "skills/react-native-video/**"
      instructions: >-
        The skill teaches library users and their agents. It must match the current API, keep v6 (<Video>)
        and v7 (useVideoPlayer + VideoView) apart, and never show a prop or method that does not exist in
        that version.
    - path: "docs/**"
      instructions: >-
        docs/docs/ is v7, docs/versioned_docs/version-6.x/ is v6. Code examples must use the API of the
        version the page documents.
    - path: "AGENTS.md"
      instructions: >-
        This file is loaded into every agent session, so each line costs. Flag a change to it in a pull
        request whose main change is something else. Check that each new line is one rule, has no history
        or story, is not already in CONTRIBUTING.md, and is true in the current code.
    - path: "CLAUDE.md"
      instructions: >-
        CLAUDE.md must stay a single line, @AGENTS.md. Rules go in AGENTS.md.

  merge_risk_instructions: >-
    High risk: the player lifecycle in packages/react-native-video/ios/ and android/ (load, release,
    replaceSourceAsync, observers, audio session, picture-in-picture, fullscreen); DRM
    (packages/drm-plugin/ and drm in a source); Nitro specs in src/spec/ (the native contract); Expo
    config plugins (they edit user projects); package.json changes (they need new E2E lockfiles); and
    .github/workflows/ (required checks). Medium risk: JS-only changes in src/core/ with unit tests.
    Low risk: docs, skills, E2E flows and tests only.

  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional commit format: type(scope): summary, with type one of feat, fix, refactor, perf,
        docs, test, ci, build, chore. Mark a breaking change with ! after the type or scope.
    description:
      mode: warning
    custom_checks:
      - name: Reproducing E2E flow for a bug fix
        mode: warning
        instructions: >-
          Pass when the pull request is not a bug fix (title does not start with fix). For a fix that
          changes load, progress, seek, volume, rate, loop, end of playback, errors or the source lifecycle
          in packages/react-native-video/: pass when it adds or changes a file in e2e/flows/, or when the
          Test plan section of the description says why no flow fits. Fail otherwise.
      - name: Docs and skill follow the API
        mode: warning
        instructions: >-
          Pass when the pull request does not change public API in packages/react-native-video/src/
          (exports, props, events, methods, exported types). If it does: pass when it also changes docs/
          and skills/react-native-video/, or when the description says they already match. Fail otherwise.
      - name: Both native platforms
        mode: warning
        instructions: >-
          Pass when the pull request changes neither packages/react-native-video/ios/ nor
          packages/react-native-video/android/, or changes both. If it changes only one: pass when the
          description names the other platform and says why it needs no change. Fail otherwise.

  tools:
    # ESLint uses the repository config. Biome and Oxlint would lint the same JS twice with other rules.
    biome:
      enabled: false
    oxc:
      enabled: false
    languagetool:
      enabled: false
    # No ktlint/swiftlint on master yet, so these two are the only native linters for now.
    # Turn them off if they are noisy, or give them a config_file once the v6 configs are ported.
    swiftlint:
      enabled: true
    detekt:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "CONTRIBUTING.md"
      - "e2e/README.md"
      - "e2e/CONTEXT.md"
