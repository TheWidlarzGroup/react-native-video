# Shared by every flow (via runFlow): starts the test app from a clean state and waits
# until it can receive a deep link. Lives outside e2e/flows/ so `maestro test e2e/flows/`
# never runs it on its own.
#
# A deep link sent before JS subscribes to Linking's 'url' event is silently dropped, so
# the test app renders e2e-host-ready only once that listener is attached (App.tsx) and
# nothing opens a scenario before it is visible.
appId: ${APP_ID}
---
# clearState and launchApp are separate steps, with a pause between them on Android, because
# `launchApp: {clearState: true}` starts the app ~0.9 s after `pm clear`. Clearing removes
# the previous run's task, and Android 14 (API 34) force-kills whatever process the package
# has when that removal's 1 s destroy timeout fires ("Destroy timeout of remove-task" then
# "Killing <pid> (adj -10000): remove task" in logcat) - by then, the process Maestro just
# started. The activity stays up with no React root: a white screen, and e2e-host-ready
# never appears. It cost 5 of 30 flows on the API 34 nightly legs and none on API 35/36;
# `pm clear; sleep D; am start` on an API 34 emulator loses 2 of 15 launches at D=0.9 and
# 0 of 15 at D=2.5 (the split steps measure 5.3-5.8 s from clear to process start under
# Maestro, against 1.3-1.8 s for the combined step locally). Maestro has no sleep command:
# waiting for an id that never exists is the idiom, and `optional` turns the expected
# timeout into a warning (the flow still reports SUCCESS in JUnit). Not a retry.
- clearState
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "e2e-never-rendered-sleep"
          timeout: 2500
          optional: true
- launchApp
# Generous on purpose: this waits for the app to start, not for library behaviour, and a
# freshly cleared app on a busy emulator or hosted runner has taken 15-18 s to get here.
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 30000
# A short settle after first paint while react-native-test-app finishes bootstrapping;
# observed to matter for scenarios that fail within milliseconds. Not a retry.
- waitForAnimationToEnd:
    timeout: 1500
