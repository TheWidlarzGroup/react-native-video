# mp4 happy path: load -> progress -> natural end (fixture is 8 s)
# Run: maestro test -e APP_ID=<bundle/package id> e2e/flows/smoke-mp4-happy-path.yaml
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
# openLink delivers the URL through the 'url' event, which is fire-and-forget: a link
# sent before JS has subscribed is silently dropped. The test app renders this marker
# only after its Linking listener is attached (App.tsx), so waiting for it is what
# makes openLink safe.
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
# Small settle buffer for RNTA's native bootstrapping after first paint; observed to
# matter for scenarios that fail almost instantly (error-404). Not a flake retry.
- waitForAnimationToEnd:
    timeout: 1500
- openLink: rnvtest://scenario/mp4
# iOS shows a one-time "Open in <app>?" system confirmation for openLink on some sessions
# (simulator-specific, not app-specific) — harmless no-op when it doesn't appear.
- extendedWaitUntil:
    visible: "Open"
    timeout: 3000
    optional: true
- tapOn:
    text: "Open"
    optional: true
# Android's singleApp mode routes rnvtest:// through MainActivity, which redirects to a
# second Activity (ComponentActivity) that actually hosts the JS — that Activity-transition
# + fresh JS mount takes a moment longer than an instant assertVisible allows for.
- extendedWaitUntil:
    visible:
      id: "scenario-mp4"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000            # generous: emulator software decoder cold start
- extendedWaitUntil:
    visible:
      id: "evt-progress-gt-2s"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "evt-onEnded"
    timeout: 20000            # clip is 8 s; must arrive well within this
- assertNotVisible:
    id: "evt-onError"
