# mp4 happy path: load -> progress -> natural end (fixture is 8 s)
# Run: maestro test -e APP_ID=<bundle/package id> e2e/flows/smoke-mp4-happy-path.yaml
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
# RCTLinkingManager.getInitialURL() only reads UIApplicationLaunchOptionsURLKey (a true
# OS-level cold-launch-via-URL). openLink instead posts the 'url' NSNotification, which is
# fire-and-forget: if it arrives before JS has mounted and subscribed, it's silently
# dropped. Wait for a marker that only exists once JS has actually rendered.
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
# RNTA's own native bootstrapping (TestApp/ReactInstance setup) can still be settling for
# a moment after first paint, even once e2e-host-ready is visible — a scenario that fails
# almost instantly (error-404: ~30ms from mount to onStatusChange('error')) can race past
# that before Linking's bridge is ready to receive the very first deep link. A slower
# scenario (real playback) doesn't expose this. Small fixed buffer, not a flake retry.
- waitForAnimationToEnd:
    timeout: 1500
- openLink: rnvtest://scenario/mp4
# iOS shows a one-time "Open in <app>?" system confirmation for openLink on some sessions
# (simulator-specific, not app-specific) — harmless no-op when it doesn't appear.
- extendedWaitUntil:
    visible: "Open"
    timeout: 3000
    optional: true
- tapOn:
    text: "Open"
    optional: true
# Android's singleApp mode routes rnvtest:// through MainActivity, which redirects to a
# second Activity (ComponentActivity) that actually hosts the JS — that Activity-transition
# + fresh JS mount takes a moment longer than an instant assertVisible allows for.
- extendedWaitUntil:
    visible:
      id: "scenario-mp4"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000            # generous: emulator software decoder cold start
- extendedWaitUntil:
    visible:
      id: "evt-progress-gt-2s"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "evt-onEnded"
    timeout: 20000            # clip is 8 s; must arrive well within this
- assertNotVisible:
    id: "evt-onError"
