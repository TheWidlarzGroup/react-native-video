# A failed source is not the end of a player: after a 404 (one onError, the error status),
# replaceSourceAsync(good source) must take the player through loading again, load the new
# clip, play it from its beginning to its end, and report no further error.
#
# No taps: the scenario replaces the source from JS in its onError listener, once
# (ScenarioScreen). Opens the mp4 scenario first, like smoke-error-404.yaml: on a truly cold
# launch a scenario that fails before any playback attempt fires no player event at all
# (e2e/CONTEXT.md, "Flow-design gotchas").
#
# readyToPlay is not asserted: iOS sometimes never reports it while a clip plays (#5155,
# see smoke-status-order.yaml). The replacement's onLoad and progress prove the recovery.
#
# Timeouts count from the latest interaction, so they grow down a run of waits
# (e2e/CONTEXT.md, "Timeouts").
appId: ${APP_ID}
tags: [smoke]
---
- runFlow: ../shared/launch-app.yaml
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: mp4
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: error-then-recover
- extendedWaitUntil:
    visible:
      id: "evt-onError"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "evt-status-error"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "evt-replace-resolved"
    timeout: 80000
- extendedWaitUntil:
    visible:
      id: "evt-replacement-loaded"
    timeout: 100000
- extendedWaitUntil:
    visible:
      id: "evt-reloaded-from-start"
    timeout: 110000
- extendedWaitUntil:
    visible:
      id: "evt-ended-after-replace"
    timeout: 135000            # the clip is 8 s
- assertVisible:
    id: "evt-loading-after-error"
- assertVisible:
    id: "evt-progress-gt-2s"
- assertNotVisible:
    id: "evt-onError-repeated"
- assertNotVisible:
    id: "evt-error-after-recovery"
- assertNotVisible:
    id: "evt-replace-rejected"
