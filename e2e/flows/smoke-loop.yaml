# Loop: enabling `loop` on the player must restart playback at the end instead of
# stopping. evt-loop-verified (eventLog.ts) marks an UNASSISTED restart on either platform:
#   - iOS: AVPlayer reports every loop pass as onEnd, so a 3rd onEnd with no tap after
#     the 2nd playthrough proves it;
#   - Android: ExoPlayer's repeat mode wraps silently (no onEnd, no onSeek), so progress
#     jumping from the end of the clip back to its start while loop is on proves it.
# Flow shape: let end #1 happen, THEN enable loop, seek back to 1 s and press play once
# (on Android the seek alone resumes playback; play is a no-op there), then make NO
# further taps. The next restart can only come from `loop` itself.
appId: ${APP_ID}
tags: [smoke]
---
- runFlow: ../shared/launch-app.yaml
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: mp4
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
# Enable loop only AFTER the first natural end. A loop tap that lands exactly at the end
# (seen in CI: 8.0 s after onLoad) makes ExoPlayer restart the source at once, with no
# onEnd, so a flow waiting for end #1 after the tap never sees it. Ended player = idle
# player, so this tap is immediate on both platforms.
- runFlow: ../shared/wait-for-end.yaml
- runFlow:
    file: ../shared/press.yaml
    env:
      BUTTON: btn-loop-on
      NTH: 1
- runFlow:
    file: ../shared/press.yaml
    env:
      BUTTON: btn-seek-1
      NTH: 1
# btn-play, not a play/pause toggle: on Android a seek from the ended state resumes
# playback by itself and taps land immediately, so a toggle would pause it again.
- runFlow:
    file: ../shared/press.yaml
    env:
      BUTTON: btn-play
      NTH: 1
- extendedWaitUntil:
    visible:
      id: "evt-loop-verified"
    timeout: 25000            # end #2 (~7s from position 1s) then an unassisted end #3
- assertNotVisible:
    id: "evt-onError"
