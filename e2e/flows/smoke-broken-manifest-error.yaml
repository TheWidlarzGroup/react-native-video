# Error path: a syntactically-broken HLS manifest must produce onError (and NOT onLoad).
# See smoke-error-404.yaml for why this warms up with the mp4 scenario first: a scenario
# that fails before ever attempting real playback never fires a single player event on a
# truly cold launch.
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: mp4
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: broken-manifest
- extendedWaitUntil:
    visible:
      id: "evt-onError"
    timeout: 20000
- assertVisible:
    id: "evt-error-code"      # exact code differs per platform; not pinned yet
- assertNotVisible:
    id: "evt-onLoad"
