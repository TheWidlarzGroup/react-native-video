# Error path: a syntactically broken HLS manifest must produce onError (and NOT onLoad).
# Opens the mp4 scenario first, like smoke-error-404.yaml.
appId: ${APP_ID}
tags: [smoke]
---
- runFlow: ../shared/launch-app.yaml
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: mp4
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: broken-manifest
- extendedWaitUntil:
    visible:
      id: "evt-onError"
    timeout: 20000
- assertVisible:
    id: "evt-error-code"      # exact code differs per platform; not pinned yet
- assertNotVisible:
    id: "evt-onLoad"
