# Error path: 404 source must produce onError (and NOT onLoad)
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
# See smoke-mp4-happy-path.yaml: openLink before JS has mounted+subscribed silently
# drops the deep link (RCTLinkingManager's 'url' event is fire-and-forget).
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
# On a truly cold launch, a scenario that fails before ever attempting real playback
# (this one) never fires a single player event — confirmed hanging even after 30s wait,
# not just slow. A scenario with real playback (mp4/hls) fires fine cold. Root cause not
# fully pinned down (looks like some native/Nitro registration path that only completes
# once triggered by an actual playback attempt). Mitigation: warm up with a real-playback
# scenario first; this is the same process the other two MVP flows already exercise
# successfully from cold, so it's proven to complete init.
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: mp4
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: error-404
- extendedWaitUntil:
    visible:
      id: "evt-onError"
    timeout: 20000
- assertVisible:
    id: "evt-error-code"      # exact code differs per platform; not pinned yet
- assertNotVisible:
    id: "evt-onLoad"
