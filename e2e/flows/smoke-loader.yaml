# VideoView's renderLoader (#5264) covers the video from the start of the load until the
# video is ready to display. The loader is a probe that logs its own mount and unmount
# (LoaderProbe in ScenarioScreen.tsx), so the flow does not depend on catching it on screen:
# evt-loader-shown, then evt-loader-hidden, while the clip plays.
#
# The loader coming back after replaceSourceAsync() is not checked here: on Android it needs
# onLoadStart on a replacement (#5271).
appId: ${APP_ID}
tags: [smoke]
---
- runFlow: ../shared/launch-app.yaml
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: mp4-loader
- extendedWaitUntil:
    visible:
      id: "evt-loader-shown"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "evt-loader-hidden"
    timeout: 20000            # generous: emulator software decoder cold start
- extendedWaitUntil:
    visible:
      id: "evt-progress-gt-2s"
    timeout: 15000
- assertNotVisible:
    id: "video-loader"
- assertNotVisible:
    id: "evt-onError"
