# HLS VOD: manifest parses, playback starts, progress advances past 2 s
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
# See smoke-mp4-happy-path.yaml: openLink before JS has mounted+subscribed silently
# drops the deep link (RCTLinkingManager's 'url' event is fire-and-forget).
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
# See smoke-mp4-happy-path.yaml: small settle buffer for RNTA's native bootstrapping.
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: hls
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 40000            # HLS: manifest + first segments over local HTTP; slow hosted simulators
- extendedWaitUntil:
    visible:
      id: "evt-progress-gt-2s"
    timeout: 15000
- assertNotVisible:
    id: "evt-onError"
