# Error path during playback: an HLS source whose first two segments load and whose third
# is missing must report onLoad, then exactly one onError and the error status.
# The assertions run on Android only: ExoPlayer fails when it reaches the missing segment.
# AVPlayer is not deterministic for this source, so iOS has nothing stable to assert
# (e2e/CONTEXT.md, "Test app gotchas").
appId: ${APP_ID}
tags: [smoke]
---
- runFlow: ../shared/launch-app.yaml
- runFlow:
    file: ../shared/open-scenario.yaml
    env:
      SCENARIO: error-mid-playback
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "evt-onLoad"
          timeout: 40000
      - extendedWaitUntil:
          visible:
            id: "evt-onError"
          timeout: 40000
      - extendedWaitUntil:
          visible:
            id: "evt-status-error"
          timeout: 20000
      - assertVisible:
          id: "evt-error-code"
          text: "error-code:player/playback-failed"
      - assertNotVisible:
          id: "evt-onError-repeated"
