# Mute, unmute, and a numeric volume change — all surfaced via onVolumeChange
# (see ScenarioScreen.tsx). evt-unmuted only fires after evt-muted, so it proves a real
# transition rather than the player's initial (unmuted) default.
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- openLink: rnvtest://scenario/mp4
- extendedWaitUntil:
    visible: "Open"
    timeout: 3000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scenario-mp4"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
- tapOn:
    id: "btn-mute-toggle"
- extendedWaitUntil:
    visible:
      id: "evt-muted"
    timeout: 15000            # tap is only actually delivered once the clip reaches its natural end (~8s, see smoke-rate.yaml and CONTEXT.md) — do not shrink this back down
- tapOn:
    id: "btn-mute-toggle"
- extendedWaitUntil:
    visible:
      id: "evt-unmuted"
    timeout: 5000
- tapOn:
    id: "btn-volume-low"
- extendedWaitUntil:
    visible:
      id: "evt-volume-low"
    timeout: 5000
