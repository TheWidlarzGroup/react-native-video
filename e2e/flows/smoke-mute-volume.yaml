# Mute, unmute, and a numeric volume change — all surfaced via onVolumeChange
# (see ScenarioScreen.tsx). evt-unmuted only fires after evt-muted, so it proves a real
# transition rather than the player's initial (unmuted) default.
appId: ${APP_ID}
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "e2e-host-ready"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- openLink: rnvtest://scenario/mp4
- extendedWaitUntil:
    visible: "Open"
    timeout: 3000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scenario-mp4"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "evt-onLoad"
    timeout: 20000
# Interact only once the player is idle: the iOS driver defers a tap issued during
# playback until the app settles, which is the clip's natural end, and a tap landing in
# the middle of that end transition was lost in CI (right coordinates, no press). Waiting
# for the end first makes the tap land on an idle player on both platforms. The mute
# markers still require the press, so nothing here passes vacuously.
- extendedWaitUntil:
    visible:
      id: "evt-onEnded"
    timeout: 20000
- tapOn:
    id: "btn-mute-toggle"
- extendedWaitUntil:
    visible:
      id: "evt-muted"
    timeout: 5000
- tapOn:
    id: "btn-mute-toggle"
- extendedWaitUntil:
    visible:
      id: "evt-unmuted"
    timeout: 5000
- tapOn:
    id: "btn-volume-low"
- extendedWaitUntil:
    visible:
      id: "evt-volume-low"
    timeout: 5000
