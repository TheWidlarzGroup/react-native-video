RNVideo_kotlinVersion=1.9.24
RNVideo_minKotlinVersion=1.8.0
RNVideo_minSdkVersion=24
RNVideo_targetSdkVersion=35
RNVideo_compileSdkVersion=35
RNVideo_ndkversion=27.1.12297006

RNVideo_useExoplayerDash=true
RNVideo_useExoplayerHls=true

# Google IMA client-side ad insertion (androidx.media3:media3-exoplayer-ima).
# Opt-in, and OFF by default on purpose: the IMA SDK pulls
# play-services-ads-identifier, which merges a `com.google.android.gms.permission.AD_ID`
# permission into the consuming app's manifest. That is a Play Console Data Safety
# declaration every consumer would otherwise be forced into, so apps that actually
# want ads must set `RNVideo_useExoplayerIma=true` themselves.
#
# Enabling it also requires the consuming app to turn on core library desugaring
# (`coreLibraryDesugaringEnabled true` + a `coreLibraryDesugaring
# "com.android.tools:desugar_jdk_libs:2.1.5"` dependency) - the Google IMA SDK
# (>= 3.38) declares that in its own AAR metadata. Consumers that leave this flag
# off are unaffected. See example/android/app/build.gradle for the exact setup.
RNVideo_useExoplayerIma=false

RNVideo_media3Version=1.9.1
RNVideo_androidxCoreVersion=1.13.1
RNVideo_androidxActivityVersion=1.9.3
