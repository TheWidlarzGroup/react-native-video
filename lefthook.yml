pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs}"
      exclude: "docs/**/*"
      run: bun lint
    lint-docs:
      # using @widlarzgroup/eslint-plugin-docusaurus for CSS variable validation
      root: "docs/"
      glob: "**/*.{js,ts,jsx,tsx,css}"
      run: bun run lint
    types:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs}"
      run: bun typecheck
    # e2e/ and scripts/ are not workspace packages, so `bun lint` / `bun typecheck` never
    # reach them. Their unit tests are the only gate they have.
    test-scripts:
      glob: "{e2e,scripts}/**/*.mjs"
      run: bun test e2e scripts
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: bunx commitlint --edit
