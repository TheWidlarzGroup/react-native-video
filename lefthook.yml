pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "docs/**/*"
      run: bun lint
    lint-docs:
      # using @widlarzgroup/eslint-plugin-docusaurus for CSS variable validation
      root: "docs/"
      glob: "**/*.{js,ts,jsx,tsx,css}"
      run: bun run lint
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun typecheck
    # The library's unit tests are not part of `bun lint` / `bun typecheck`.
    test:
      glob: "packages/react-native-video/**/*.{ts,tsx}"
      run: bun run test
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: bunx commitlint --edit
