name: setup bun
description: Setup bun and install dependencies

inputs:
  working-directory:
    description: 'working directory for bun install'
    default: ./
    required: false
  frozen:
    description: 'Install with --frozen-lockfile. Used by the E2E matrix legs, which swap the root lockfile per React Native version.'
    default: 'false'
    required: false
  cache:
    description: 'Cache node_modules between runs. Off on macOS runners, where saving the tree took ~5 minutes against a ~1.5 minute install.'
    default: 'true'
    required: false

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Single source for every job: .bun-version at the repo root.
        bun-version-file: .bun-version

    # Frozen (E2E matrix) and non-frozen (docs) callers get separate cache namespaces.
    # A matrix leg installs a node_modules tree that nests a different react-native
    # under test-app/ per RN version; a docs job restoring such a tree through a broad
    # restore-key and re-saving it under the floor lockfile's hash would poison the
    # floor leg. Frozen callers therefore only ever restore an entry saved for the exact
    # same lockfile set, and non-frozen callers never see frozen entries at all.
    - name: Cache dependencies
      id: bun-cache
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          **/node_modules
        # patch-package edits files inside node_modules at postinstall and cannot apply a
        # changed patch on top of an already-patched tree. The patches hash therefore
        # comes FIRST, so every restore-key prefix below carries it and a patch change
        # misses every cached tree, including the broad shared fallback.
        key: ${{ runner.os }}-v8-bun-${{ inputs.frozen == 'true' && 'frozen' || 'shared' }}-${{ hashFiles('**/patches/*.patch') }}-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-v8-bun-${{ inputs.frozen == 'true' && 'frozen' || 'shared' }}-${{ hashFiles('**/patches/*.patch') }}-${{ hashFiles('**/bun.lock') }}-
          ${{ inputs.frozen != 'true' && format('{0}-v8-bun-shared-{1}-', runner.os, hashFiles('**/patches/*.patch')) || '' }}

    - name: Install dependencies
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        FROZEN: ${{ inputs.frozen }}
      run: |
        set -euo pipefail
        if [ "$FROZEN" != "true" ]; then
          bun install
          exit 0
        fi
        if ! bun install --frozen-lockfile; then
          echo "::error::bun install --frozen-lockfile failed. The E2E matrix installs every RN variant from a committed lockfile (e2e/rn-matrix/<version>/bun.lock, which snapshots the whole workspace). If this PR changed any package.json, regenerate the variants: for v in 0.82 0.87; do node scripts/e2e/use-rn-version.mjs \$v --refresh; done — and commit e2e/rn-matrix/. See e2e/rn-matrix/README.md." >&2
          exit 1
        fi
