name: setup bun
description: Setup bun and install dependencies

inputs:
  working-directory:
    description: 'working directory for bun install'
    default: ./
    required: false
  frozen:
    description: 'Install with --frozen-lockfile (required for matrix jobs)'
    default: 'false'
    required: false

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.1

    - name: Cache dependencies
      id: bun-cache
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-v7-bun-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/package.json') }}
        # The bare `${{ runner.os }}-v7-bun-` prefix is only safe as a restore-key
        # fallback when every caller resolves the same dependency tree (today: the docs
        # workflows). A frozen/matrix caller (e2e-setup) selects a React Native version by
        # swapping test-app/package.json and the root bun.lock BEFORE this step runs, so
        # hashFiles('**/bun.lock') already is version-specific — but the bare prefix would
        # still happily restore a node_modules tree cached for a DIFFERENT RN version on a
        # miss, and a --frozen-lockfile install does not reliably correct a stale nested
        # test-app/node_modules/react-native left behind by that mismatch. So when
        # `frozen` is true, drop the broad fallback entirely: restore-keys collapses to the
        # same version-specific prefix twice (a harmless no-op duplicate), meaning a miss
        # falls through to a clean install instead of a foreign tree.
        #
        # Deliberately NOT written as `frozen == 'true' && SAFE || UNSAFE`: that idiom
        # returns UNSAFE whenever SAFE is falsy, regardless of the condition — and an
        # empty hashFiles() result (e.g. the glob matches nothing) is falsy in GHA
        # expressions. Guarding the SAFE branch would silently fall through to the
        # unsafe bare prefix even with frozen == 'true'. Instead the UNSAFE value is
        # gated behind its own condition on the right of `||`, so it is only ever
        # produced when `frozen != 'true'` evaluates true — there is no path to it
        # while frozen == 'true', independent of whether the left branch is truthy.
        restore-keys: |
          ${{ runner.os }}-v7-bun-${{ hashFiles('**/bun.lock') }}
          ${{ inputs.frozen == 'true' && format('{0}-v7-bun-{1}', runner.os, hashFiles('**/bun.lock')) || (inputs.frozen != 'true' && format('{0}-v7-bun-', runner.os)) }}

    - name: Install dependencies
      working-directory: ${{ inputs.working-directory }}
      run: bun install ${{ inputs.frozen == 'true' && '--frozen-lockfile' || '' }}
      shell: bash

