name: Check iOS

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/check-ios.yml'
      - 'ios/**'
  pull_request:
    paths:
      - '.github/workflows/check-ios.yml'
      - 'ios/**'

jobs:
  Swift-Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with SwiftLint
        uses: norio-nomura/action-swiftlint@master
        with:
          args: --strict
        env:
          WORKING_DIRECTORY: ios
  Swift-Format:
    runs-on: macos-latest
    env:
      # Pinned: Homebrew always installs the newest SwiftFormat, and new releases add
      # rules that reformat code which was clean the day before.
      SWIFTFORMAT_VERSION: '0.54.5'
    defaults:
      run:
        working-directory: ./ios
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Format Swift code
        run: swiftformat --verbose .

      - name: Verify formatted code is unchanged
        run: git diff --exit-code HEAD
