# Reusable Android E2E leg — one (rn-version, api-level) matrix cell. Called by the
# PR-gate (e2e.yml) and nightly (e2e-nightly.yml) orchestrators, never triggered directly.
name: _e2e-android

on:
  workflow_call:
    inputs:
      rn-version:
        description: 'React Native version id, matching e2e/rn-matrix (0.77 is the floor)'
        type: string
        required: true
      api-level:
        description: 'Android emulator API level'
        type: string
        required: true
      blocking:
        description: 'false => the job reports but does not fail the calling run'
        type: boolean
        default: true
      tags:
        description: 'Maestro tag selection, e.g. --exclude-tags=flaky'
        type: string
        default: '--exclude-tags=flaky'
      artifact-name:
        description: 'Artifact name to upload under. The nightly orchestrator passes the name it expects to download; when empty, one is derived from rn-version/api-level/tags.'
        type: string
        default: ''

env:
  APP_ID: com.rnvtest.host

permissions:
  contents: read

jobs:
  run:
    # The status context GitHub shows is "<caller job name> / <this job name>", so this
    # name is part of every branch-protection rule. See e2e.yml before renaming.
    name: maestro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only changes the conclusion reported to the caller; the summary/upload steps below
    # still need their own `if: always()`.
    continue-on-error: ${{ !inputs.blocking }}
    steps:
      - uses: actions/checkout@v4

      # upload-artifact@v4 hard-errors on a duplicate name within a run, so the name has
      # to differ per (rn-version, api-level, tag selection). The slug also keys the AVD
      # cache: a quarantine leg and its coverage sibling share coordinates but must not
      # share emulator state.
      - name: Resolve artifact name
        id: suffix
        env:
          TAGS: ${{ inputs.tags }}
          GIVEN_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          SLUG=$(echo "$TAGS" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-+|-+$//g')
          if [ -z "$SLUG" ]; then
            echo "::error::tags '${TAGS}' produced an empty slug" >&2
            exit 1
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "name=${GIVEN_NAME:-e2e-android-rn${{ inputs.rn-version }}-api${{ inputs.api-level }}-${SLUG}}" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/e2e-setup
        with:
          rn-version: ${{ inputs.rn-version }}
          platform: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # x86_64 only: that is the emulator ABI; the other three would be built and thrown
      # away.
      - name: Build test app APK
        run: cd test-app/android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api-level }}-rn${{ inputs.rn-version }}-${{ steps.suffix.outputs.slug }}

      # Boots once and lets the emulator save its snapshot on exit; the cache step above
      # stores that snapshot at the end of the job.
      - name: Create AVD and cache a cold snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD created"

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Passed through the environment so a tags value cannot break out of the
          # command line via `${{ }}` text substitution.
          TAGS: ${{ inputs.tags }}
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The action runs EVERY LINE of this script as its own `/usr/bin/sh -c`, and
          # stops at the first line that exits non-zero. So: one command per line, no
          # backslash continuations (the continuation would become a separate command
          # and `\` the flow path), and no `set -e`, which would only apply to its own
          # line.
          script: |
            adb install -r test-app/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb logcat > logcat.txt &
            maestro test -e APP_ID=${{ env.APP_ID }} $TAGS --format junit --output e2e-report.xml --debug-output maestro-debug e2e/flows/

      - name: Job summary
        if: always()
        run: |
          node scripts/e2e/junit-summary.mjs e2e-report.xml \
            "android · RN ${{ inputs.rn-version }} · API ${{ inputs.api-level }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.suffix.outputs.name }}
          path: |
            e2e-report.xml
            maestro-debug/**
            logcat.txt
          if-no-files-found: ignore
